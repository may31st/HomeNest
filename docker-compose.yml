version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: renthouse_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: renthouse
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: renthouse_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=development
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=renthouse
      - JWT_SECRET=super_secret_jwt_key_renthouse
      # Thêm các API keys khác nếu cần thiết (ví dụ: OPENROUTER_KEY, VNP_TMNCODE, VNP_HASHSECRET)
    depends_on:
      - db

  chatbot:
    build:
      context: ./ChatBot
      dockerfile: Dockerfile
    container_name: renthouse_chatbot
    restart: always
    ports:
      - "5001:5001"
    volumes:
      - chatbot_data:/app/chromaDB

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: renthouse_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
  chatbot_data:
